name: 🔧 작업
description: 리팩터링 · 인프라 · 테스트 · 문서 · 기술 조사
title: "[Chore] "
labels: ["task"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 종류
      options:
        - 리팩터링 · 기술 부채
        - 빌드 · 배포 · 인프라
        - 테스트 추가
        - 문서
        - 의존성 업데이트
        - 기술 조사 (Spike)
        - 기타
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 무엇을 달성하려는지. 지금 해야 하는 이유가 있으면 함께.
      placeholder: 통합 테스트가 5분 넘게 걸려 CI 대기가 길다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건 · 검증 방법
      description: 리팩터링이면 "기존 테스트 통과"처럼 무엇으로 확인할지 적는다.

  - type: dropdown
    id: priority
    attributes:
      label: 우선도
      options:
        - high — 다른 작업이 막혀 있음
        - medium — 다음 배포 전
        - low — 여유 있을 때
    validations:
      required: true
