name: ✨ 기능 제안
description: 새 기능이나 기존 기능의 개선을 제안해 주세요.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 제품 / 영역
      options:
        - 차량용 CMS
        - 모바일 앱 (Android)
        - 모바일 앱 (iOS)
        - 임베디드 / 펌웨어
        - 백엔드 / API
        - 웹사이트
        - 인프라 / CI
        - 기타 · 미정
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 해결책보다 문제 상황을 먼저 적어주세요. 누가, 어떤 상황에서 불편한지가 중요합니다.
      placeholder: 현장 작업자가 데칼 재고를 확인하려면 사무실에 전화해야 합니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 떠오르는 구현 방향이 있다면 적어주세요. 없어도 괜찮습니다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법을 고려했다면, 그리고 왜 그 방법을 택하지 않았는지 적어주세요.

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있나요?
      value: |
        - [ ]
        - [ ]

  - type: dropdown
    id: priority
    attributes:
      label: 우선도 (제안자 기준)
      options:
        - High — 현재 업무가 막혀 있음
        - Medium — 있으면 확실히 좋음
        - Low — 여유 있을 때
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 관련 이슈, 기획서, 화면 시안, 외부 링크 등.
