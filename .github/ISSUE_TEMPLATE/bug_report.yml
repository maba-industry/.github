name: 🐛 버그
description: 수정이 필요한 결함
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: 현상
      description: 무엇이 어떻게 잘못 동작하는지.
      placeholder: 차량 목록 화면에서 새로고침하면 앱이 종료된다.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현
      description: 절차 또는 재현 조건. 간헐적이면 그렇게 적는다.
      value: |
        1.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 현상만으로 명확하면 비워둔다.

  - type: textarea
    id: cause
    attributes:
      label: 원인 추정 · 관련 코드
      description: 짚이는 파일·함수·커밋이 있으면 적는다. 없으면 비워둔다.
      placeholder: VehicleListViewModel.refresh() — 응답이 null 일 때 분기 없음

  - type: textarea
    id: environment
    attributes:
      label: 환경
      value: |
        - 버전 / 커밋:
        - 환경: local / dev / staging / prod
        - 기기 · 브라우저:

  - type: textarea
    id: logs
    attributes:
      label: 로그 · 스택 트레이스
      render: shell

  - type: dropdown
    id: priority
    attributes:
      label: 우선도
      options:
        - high — 서비스 영향 있음 · 즉시
        - medium — 다음 배포 전
        - low — 여유 있을 때
    validations:
      required: true
