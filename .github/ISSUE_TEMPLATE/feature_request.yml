name: ✨ 기능 구현
description: 새로 만들 기능 또는 기존 기능 개선
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: requirement
    attributes:
      label: 무엇을 만드나
      description: 구현할 내용을 한두 문장으로.
      placeholder: 현장 작업자가 모바일에서 데칼 재고 수량을 조회할 수 있게 한다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 · 목적
      description: 왜 필요한지. 요청자나 관련 논의가 있으면 함께 적는다.

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 이번에 포함하는 것과 하지 않는 것을 나누면 리뷰 범위가 명확해진다.
      value: |
        포함:
        -

        제외:
        -

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 닫을 수 있는지.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 참고
      description: 기획서, 화면 시안, API 스펙, 관련 이슈·PR.

  - type: dropdown
    id: priority
    attributes:
      label: 우선도
      options:
        - high — 다른 작업이 이걸 기다림
        - medium — 다음 배포 전
        - low — 여유 있을 때
    validations:
      required: true
